plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.guardiancloud.segrec'
version = '0.0.0'

android {
  namespace "com.guardiancloud.segrec"
  defaultConfig {
    versionCode 1
    versionName "0.0.0"
    // TEMPORARY — EXPORT-MP4 · EXTRACTOR PTS PROBE, step 1 of the remux gate.
    // Instrumented tests only. Nothing in `src/main` depends on this, and the
    // test APK is a separate package (`com.guardiancloud.segrec.test`) so it
    // installs beside the BENCH build without touching or replacing it.
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }
}

// SPIKE — early gate for P2 (Camera2 + MediaCodec + AudioRecord + MediaMuxer).
//
// No dependencies. Everything used here is a platform API available from
// API 24: android.hardware.camera2, android.media.MediaCodec,
// android.media.AudioRecord, android.media.MediaMuxer.
//
// `expo-module-gradle-plugin` supplies compileSdk/minSdk/targetSdk from the
// host project's rootProject.ext, so this module inherits minSdk 24.
dependencies {
  // TEMPORARY — probe only. `androidTestImplementation` never reaches the
  // library, the app, or any shipped artifact.
  androidTestImplementation 'androidx.test:runner:1.5.2'
  androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}
